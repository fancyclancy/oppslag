<!-- One theme colour = the app's own background, so the status bar blends in. iOS Home Screen apps
     don't switch between media-query variants, so a tiny script picks light or dark before first paint. -->
<meta name="theme-color" content="#1C1B1C">
<script>
  (function () {
    try {
      var s = (JSON.parse(localStorage.getItem('oppslag.v1') || '{}').settings) || {};
      var t = s.theme || 'auto';
      var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#1C1B1C' : '#F5F2EC');
      if (t !== 'auto') document.documentElement.dataset.theme = t;   // the launch screen uses the chosen theme too
      // the app reloaded itself in the background to update: come back without the launch logo
      if (sessionStorage.getItem('oppslag.quiet')) { sessionStorage.removeItem('oppslag.quiet'); document.documentElement.classList.add('no-splash'); }
      // Home Screen app on iOS: for its first frames iOS lays the page out below the status bar, then
      // grows it to the full screen, so a launch icon centred in the page jumped up by half the status
      // bar. The bottom edge doesn't move, so the icon is placed from the bottom, at the screen's centre
      // (where iOS's own launch image has it too).
      if (navigator.standalone === true) {
        var land = matchMedia('(orientation: landscape)').matches;
        var sh = land ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
        document.documentElement.style.setProperty('--screen-h', sh + 'px');
        document.documentElement.classList.add('ios-app');
      }
    } catch (e) {}
  })();
</script>
